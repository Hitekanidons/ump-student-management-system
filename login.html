<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — To be sold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="auth-shell">
    <aside class="auth-brand">
      <a href="index.html" class="auth-brand__logo">
        <span>To be sold</span>
      </a>
      <div class="auth-brand__copy">
        <h2>Welcome back.</h2>
        <p>Sign in to access your module resources, announcements and examination scope — all in one dashboard.</p>
      </div>
      <div class="auth-brand__features">
        <div><i data-lucide="graduation-cap"></i> Students</div>
        <div><i data-lucide="presentation"></i> Lecturers</div>
        <div><i data-lucide="shield"></i> Role-based access</div>
      </div>
    </aside>

    <section class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1>Sign in</h1>
        <p class="auth-subtitle">Enter your credentials to continue.</p>

        <div id="loginBanner" class="auth-banner" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email"
                   placeholder="230236088@ump.ac.za" required>
            <p class="field-error" id="emailError"></p>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password"
                     autocomplete="current-password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" data-toggle-password="password" aria-label="Show password">
                <i data-lucide="eye"></i>
              </button>
            </div>
            <p class="field-error" id="passwordError"></p>
          </div>

          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" class="link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <span>Sign in</span>
          </button>

          <p class="form-footer">
            New student? <a href="register.html" class="link">Create an account</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>window.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
