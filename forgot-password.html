<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — UMP BICT Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-shell">
    <aside class="auth-brand">
      <a href="index.html" class="auth-brand__logo">
        <span class="auth-brand__logo-mark">UMP</span>
        <span>BICT Learning Platform</span>
      </a>
      <div class="auth-brand__copy">
        <h2>Reset your password securely.</h2>
        <p>We'll email you a secure link from Firebase Authentication. No passwords are ever stored in our database.</p>
      </div>
      <div class="auth-brand__features">
        <div><i data-lucide="key-round"></i> Secure link</div>
        <div><i data-lucide="mail"></i> Sent by email</div>
      </div>
    </aside>

    <section class="auth-form-panel">
      <div class="auth-form-wrap">
        <h1>Forgot password?</h1>
        <p class="auth-subtitle">Enter your UMP email and we'll send you a reset link.</p>

        <div id="resetBanner" class="auth-banner" role="alert"></div>

        <form id="resetForm" novalidate>
          <div class="form-field">
            <label for="email">UMP email address</label>
            <input type="email" id="email" name="email" autocomplete="email"
                   placeholder="230236088@ump.ac.za" required>
            <p class="field-error" id="emailError"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <span>Send reset link</span>
          </button>

          <p class="form-footer">
            Remembered it? <a href="login.html" class="link">Back to sign in</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>window.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
  <script type="module">
    import { auth } from "./js/firebase-init.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { validateUmpEmail } from "./js/validators.js";
    import { $, setBusy, friendlyAuthError } from "./js/utils.js";

    const form = $("#resetForm");
    const emailEl = $("#email");
    const errorEl = $("#emailError");
    const banner = $("#resetBanner");
    const submitBtn = $("#submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      banner.className = "auth-banner";
      errorEl.textContent = "";

      const check = validateUmpEmail(emailEl.value.trim(), emailEl.value.match(/^\d{9}/)?.[0]);
      if (!check.ok) {
        errorEl.textContent = check.message;
        emailEl.focus();
        return;
      }

      setBusy(submitBtn, true, "Sending…");
      try {
        await sendPasswordResetEmail(auth, emailEl.value.trim().toLowerCase());
        banner.className = "auth-banner auth-banner-success show";
        banner.textContent = "If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder).";
        form.reset();
      } catch (err) {
        // Do not reveal whether the account exists — same message either way.
        if (err.code === "auth/user-not-found") {
          banner.className = "auth-banner auth-banner-success show";
          banner.textContent = "If an account exists for that email, a reset link is on its way.";
        } else {
          banner.className = "auth-banner auth-banner-error show";
          banner.textContent = friendlyAuthError(err.code);
        }
      } finally {
        setBusy(submitBtn, false);
      }
    });
  </script>
</body>
</html>
